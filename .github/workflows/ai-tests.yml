name: 'AI Music Studio: Tests (lean)'

on:
  workflow_dispatch:
  push:
    branches:
      - ai-music-studio
  pull_request:
    paths:
      - 'src/aicore/**'
      - 'src/aiproject/**'
      - 'src/aijobs/**'
      - 'src/ailibrary/**'
      - 'src/aistudio/**'
      - 'src/aimusic/**'
      - 'src/songplan/**'
      - 'src/appshell/qml/Audacity/AppShell/ProjectPage/AIStudioPanel.qml'
      - 'src/appshell/qml/Audacity/AppShell/LibraryPage/**'
      - '.github/workflows/ai-tests.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI_DIR: buildscripts/ci

jobs:
  ai_unit_tests:
    runs-on: ubuntu-22.04
    steps:
      - name: Clone repository
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Configure workflow
        run: |
          cmake -DEVENT=${{ github.event_name }} \
                -DBUILD_MODE="devel_build" \
                -DARTIFACT_INFO="build.artifacts/" \
                -P ${CI_DIR}/common/ci_configure.cmake

      - name: Restore ccache
        id: restore-ccache
        uses: actions/cache/restore@v5
        with:
          path: ${{ github.workspace }}/.ccache
          key: ${{ github.workflow }}-${{ runner.arch }}-ccache-
          restore-keys: ${{ github.workflow }}-${{ runner.arch }}-ccache-

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.10.1'
          host: 'linux'
          target: 'desktop'
          arch: 'linux_gcc_64'
          modules: 'qt5compat qtnetworkauth qtshadertools qtwebsockets qtgraphs qtquick3d'
          cache: true

      # Fast syntax validation for the QML we own. Custom Muse modules are not
      # importable here, so warnings are unlimited (-1) and only real syntax
      # errors fail the step.
      - name: Lint AI QML
        run: |
          for file in \
            src/appshell/qml/Audacity/AppShell/ProjectPage/AIStudioPanel.qml \
            src/appshell/qml/Audacity/AppShell/LibraryPage/LibraryPage.qml; do
            if [ -f "$file" ]; then
              echo "qmllint $file"
              qmllint --max-warnings -1 "$file"
            fi
          done

      - name: Setup environment
        run: bash ./buildscripts/ci/linux/setup.sh

      - name: Setup ccache
        run: |
          sudo apt-get update && sudo apt-get install -y ccache
          bash ./buildscripts/ci/tools/setup_ccache_config.sh

      # Configure the same way the full unit-test job does, but do NOT build
      # every target. Only the AI modules and their tests are compiled, which
      # keeps this job to minutes instead of an hour.
      - name: Configure unit tests
        run: |
          source $HOME/build_tools/environment.sh
          cmake -S . -B build.debug -GNinja \
                -DCMAKE_BUILD_TYPE=Debug \
                -DAU4_BUILD_MODE=dev \
                -DAU4_BUILD_CONFIGURATION=UTEST \
                -DCMAKE_INSTALL_PREFIX=../build.install \
                -DCMAKE_BUILD_NUMBER=0 \
                -DAU4_REVISION=lean \
                -DMUSE_ENABLE_UNIT_TESTS=ON \
                -DMUSE_ENABLE_UNIT_TESTS_CODE_COVERAGE=OFF \
                -DMUSE_MODULE_DIAGNOSTICS_CRASHPAD_CLIENT=OFF

      - name: Build AI modules and tests
        run: |
          source $HOME/build_tools/environment.sh
          ninja -C build.debug aistudio songplan ailibrary_tests aijobs_tests songplan_tests

      - name: Run AI unit tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          ctest --test-dir build.debug -R 'ailibrary_tests|aijobs_tests|songplan_tests' --output-on-failure

      - name: Prepare ccache
        if: always()
        run: ccache --recompress 10 || true

      - name: Save ccache
        if: always()
        uses: actions/cache/save@v5
        with:
          path: ${{ github.workspace }}/.ccache
          key: ${{ github.workflow }}-${{ runner.arch }}-ccache-${{ github.run_id }}